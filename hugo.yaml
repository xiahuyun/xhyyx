
baseURL: "https://xhyyx.pages.dev/"
title: "Inkwell Corner"
copyright: "[©2026 Inkwell Corner](https://xhyyx.pages.dev/)"
theme: PaperMod
languageCode: zh-cn
 
enableInlineShortcodes: true
hasCJKLanguage: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
    # https://gohugo.io/content-management/menus/#define-in-site-configuration
    menus:
      main:
        - name: 首页
          pageRef: /
          weight: 4 # 控制在页面上展示的前后顺序
        - name: 归档
          pageRef: archives/
          weight: 5
        - name: 分类
          pageRef: categories/
          weight: 10
        - name: 标签
          pageRef: tags/
          weight: 10
        - name: 搜索
          pageRef: search/
          weight: 20
        - name: 阅读
          pageRef: read/
          weight: 21
        - name: 关于
          pageRef: about/
          weight: 25

pagination:
  disableAliases: false
  pagerSize: 3

# https://github.com/adityatelange/hugo-PaperMod/wiki/Features#search-page
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
  author: xhyyx
  defaultTheme: dark
  ShowShareButtons: false
  ShowReadingTime: false
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true
  images: ["https://i.postimg.cc/7hwBy7VS/calcr.png"]
  DateFormat: "2006-01-02"

  homeInfoParams:
    Title: "欢迎光临 👋"
    ImageUrl: "home.png"
    Content: 让我们红尘作伴活得潇潇洒洒，策马奔腾共享人世繁华

  socialIcons:
    - name: github
      title: Follow my Github
      url: "https://github.com/xiahuyun"
    - name: cnblogs
      title: Follow my Blog
      url: "https://www.cnblogs.com/xingzheanan"
    - name: wechat
      title: Follow my WeChat
      url: "https://mp.weixin.qq.com/s/JcewFRttKz31sPsnqdeBOw"
  # 搜索
  fuseOpts:
    isCaseSensitive: false # 是否大小写敏感
    shouldSort: true # 是否排序
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
    includeMatches: true

  # 设置网站的标签页的图标，即 favicon
  assets:
    favicon: "/inkicon.png"
    favicon16x16: "/inkicon.png"
    favicon32x32: "/inkicon.png"
    apple_touch_icon: "/inkicon.png"
    safari_pinned_tab: "/inkicon.png"
    disableHLJS: true

  # 评论的设置
  giscus:
    repo: "xiahuyun/xhyyx"
    repoId: "R_kgDOSxmWtw"
    category: "Announcements"
    categoryId: "DIC_kwDOSxmWt84C-jvP"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    lightTheme: "light"
    darkTheme: "dark"
    lang: "zh-CN"
    crossorigin: "anonymous"

markup:
  goldmark:
    renderer:
      unsafe: true # 可以 unsafe，有些 html 标签和样式可能需要
  highlight:
    anchorLineNos: false # 不要给行号设置锚标
    codeFences: true # 代码围栏
    noClasses: false # TODO: 不知道干啥的，暂时没必要了解，不影响展示
    lineNos: true # 代码行
    lineNumbersInTable: false # 不要设置成 true，否则如果文章开头是代码的话，摘要会由一大堆数字(即代码行号)开头文章
    # 这里设置 style 没用，得自己加 css
    # style: "github-dark"
    # style: monokai
